apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgrest
  namespace: desafio-k8s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgrest
  template:
    metadata:
      labels:
        app: pgrest
    spec:
      containers:
        - name: pgrest
          image: postgrest/postgrest
          ports:
            - containerPort: 3000
          env:
            - name: PGRST_DB_ANON_ROLE
              value: "desafio"
          envFrom:
            - secretRef:
                name: postgres-secret
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"